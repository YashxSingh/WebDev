<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freelance-form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <h1>
            Freelance-form
        </h1>
    </header>
    <div class="outer-box">
        <p class="heading">Need to hire a freelancer?</p>
        <div class="text-label">
            <p class="label">Sign up, type in what you need and recieve free quotes in seconds.</p>
        </div>
        <form method="post">
            <input class="search-box" type="text" name="search-text" id="search-text" placeholder="What do you need done?" minlength="4">
            <input class="button" type="button" value="Post a Project">
        </form>
    </div>
</body>
</html>
