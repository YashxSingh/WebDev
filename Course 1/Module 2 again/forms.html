<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forms in HTML</title>
  </head>

  <body>
    <header class="header">
      <h1 class="heading">HTML Forms</h1>
    </header>
    <div class="form">
      <form class="form-1" method="post">
        <div class="name-field">
          <label for="Name">Name: </label>
          <input
            type="text"
            name="Name"
            id="Name"
            placeholder="Enter Name"
            required
            minlength="3"
            maxlength="15" />
        </div>
        <br />
        <div class="email-field">
          <label for="email">Email: </label>
          <input
            type="email"
            name="email"
            id="email"
            placeholder="Enter Email"
            value="test@test.com"
            disabled />
        </div>
        <br />
        <div class="password-field">
          <label for="password">Password: </label>
          <input
            type="password"
            name="password"
            id="password"
            placeholder="Enter Password"
            minlength="8" />
        </div>
        <br />
        <div class="select-field">
          <label for="products">Product:</label>
          <select name="products" id="products">
            <!-- <select name="products" id="products" multiple size="3"> -->
            <option value="iphone">IPhone</option>
            <option value="a53" selected>Samsung a53</option>
            <option value="v23">Vivo V23</option>
            <option value="edge50f">Moto Edge 50 Fusion</option>
            <option value="mi15">Redmi Note 15 Pro</option>
          </select>
        </div>
        <br />
        <div class="textarea-field">
          <label for="message">Issue: </label><br />
          <textarea
            name="message"
            id="message"
            cols="30"
            rows="4"
            placeholder="Enter your issue here"></textarea>
        </div>
        <br />
        <div class="checkbox-field">
            <label for="languages">Languages:</label>
          <label for="HTML">
            <input type="checkbox" name="languages" id="HTML" value="HTML" disabled/>
            HTML
          </label>
          <label for="CSS">
            <input type="checkbox" name="languages" id="CSS" value="CSS"/>
            CSS
          </label>
          <label for="JavaScript">
            <input type="checkbox" name="languages" id="JavaScript" value="JavaScript" checked/>
            JavaScript
          </label>
        </div>
        <br>
        <div class="radiobutton-field">
            <label for="size">Size: </label>
            <label for="small"><input type="radio" name="size" id="small" value="small">Small</label>
            <label for="medium"><input type="radio" name="size" id="medium" value="medium" checked>Medium</label>
            <label for="large"><input type="radio" name="size" id="large" value="large">Large</label>
        </div>
        <br>
        <div class="color-field">
            <label for="color">Color: </label>
            <input type="color" name="color" id="color">
        </div>
        <br>
        <div class="date-field">
            <label for="date">Date: </label>
            <input type="date" name="date" id="date">
        </div>
        <br>
        <div class="time-field">
            <label for="time">Time: </label>
            <input type="time" name="time" id="time">
        </div>
        <br>
        <div class="week-field">
            <label for="week">Week: </label>
            <input type="week" name="week" id="week">
        </div>
        <br>
        <div class="month-field">
            <label for="month">Month: </label>
            <input type="month" name="month" id="month">
        </div>
        <br>
        <div class="range-field">
            <label for="range">Range: </label>
            <input type="range" name="range" id="range" min="0" max="100" step="25">
        </div>
        <br>
        <div class="url-field">
            <label for="url">URL:</label>
            <input type="url" name="url" id="url">
        </div>
        <br>
        <div class="datalist-field">
            <label for="City">City</label>
            <input list="cities_list" id="City" name="City">
            <datalist id="cities_list">
                <option value="Delhi">Delhi</option>
                <option value="Mumbai">Mumbai</option>
                <option value="Chennai">Chennai</option>
                <option value="Kolkata">Kolkata</option>
                <option value="Hyderabad">Hyderabad</option>
            </datalist>
            <br><br>
            <label for="slot">Slot:</label>
            <input type="time" name="slot" id="slot" list="slots_list">
            <datalist id="slots_list">
                <option value="10:00">10:00</option>
                <option value="12:00">12:00</option>
                <option value="02:00">02:00</option>
                <option value="04:00">04:00</option>
            </datalist>
            <br><br>
            <label for="donation">Donation</label>
            <input list="donation_list" type="range" name="donation" id="donation" min="500" max="5000" step="500">
            <datalist id="donation_list">
                <option value="500">500</option>
                <option value="1000">1000</option>
                <option value="1500">1500</option>
                <option value="2000">2000</option>
                <option value="2500">2500</option>
                <option value="3000">3000</option>
                <option value="3500">3500</option>
                <option value="4000">4000</option>
                <option value="4500">4500</option>
                <option value="5000">5000</option>
            </datalist>
        </div>
        <br>
        <div class="submit-button">
          <input type="submit" value="Submit" />
        </div>
      </form>
    </div>
  </body>
</html>
